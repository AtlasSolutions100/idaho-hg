    TimeEntry:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        employeeName:
          type: string
        employeeRole:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        date:
          type: string
        visitType:
          $ref: "#/components/schemas/VisitType"
        timeIn:
          type: string
          description: Clock-in time "HH:MM" (24-hour)
        timeOut:
          type: string
          description: Clock-out time "HH:MM" (24-hour)
        hours:
          type: number
        mileage:
          type: number
        perDiem:
          type: number
        perDiemType:
          $ref: "#/components/schemas/PerDiemType"
        isWeekend:
          type: boolean
        isHoliday:
          type: boolean
        note:
          type: string
        status:
          $ref: "#/components/schemas/EntryStatus"
        isDemo:
          type: boolean
        submittedAt:
          type: string
        approvedAt:
          type: string
        adminEditedAt:
          type: string
          description: When Molly (admin) last adjusted this entry during approval
        adminEditSummary:
          type: string
          description: Human-readable summary of what Molly changed
      required:
        - id
        - employeeId
        - employeeName
        - employeeRole
        - clientId
        - clientName
        - date
        - isWeekend
        - isHoliday
        - status
        - submittedAt
    CreateTimeEntry:
      type: object
      properties:
        employeeId:
          type: string
        clientId:
          type: string
        date:
          type: string
        visitType:
          $ref: "#/components/schemas/VisitType"
        timeIn:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Clock-in time "HH:MM" (24-hour). Provide with timeOut instead of hours.
        timeOut:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Clock-out time "HH:MM" (24-hour); an earlier time than timeIn means the shift crossed midnight
        hours:
          type: number
          minimum: 0
          maximum: 24
          description: Legacy direct hours; ignored when timeIn/timeOut are provided
        mileage:
          type: number
          minimum: 0
        perDiem:
          type: number
          minimum: 0
          maximum: 1
          description: Legacy numeric per-diem days; ignored when perDiemType is provided
        perDiemType:
          $ref: "#/components/schemas/PerDiemType"
        isWeekend:
          type: boolean
          description: Ignored — the server derives weekend from the date
        isHoliday:
          type: boolean
          description: Ignored — the server determines holidays from its own calendar
        note:
          type: string
        status:
          $ref: "#/components/schemas/CreateEntryStatus"
      required:
        - employeeId
        - clientId
        - date
    BatchCreateTimeEntry:
      type: object
      description: >
        Submit multiple visit types for the same client/date in a single atomic
        request. The server inserts one time entry per visit type inside one
        transaction; mileage and per diem are recorded on the first entry only.
      properties:
        employeeId:
          type: string
        clientId:
          type: string
        date:
          type: string
        visitTypes:
          type: array
          items:
            $ref: "#/components/schemas/VisitType"
          minItems: 1
          maxItems: 20
        mileage:
          type: number
          minimum: 0
        perDiemType:
          $ref: "#/components/schemas/PerDiemType"
        note:
          type: string
        status:
          $ref: "#/components/schemas/CreateEntryStatus"
      required:
        - employeeId
        - clientId
        - date
        - visitTypes
    UpdateTimeEntry:
      type: object
      description: >
        Full replacement of an entry's editable fields. The employee never
        changes — only client, date, work details, and (optionally) status.
      properties:
        clientId:
          type: string
        date:
          type: string
        visitType:
          $ref: "#/components/schemas/VisitType"
        timeIn:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Clock-in time "HH:MM" (24-hour). Provide with timeOut instead of hours.
        timeOut:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Clock-out time "HH:MM" (24-hour); an earlier time than timeIn means the shift crossed midnight
        hours:
          type: number
          minimum: 0
          maximum: 24
          description: Legacy direct hours; ignored when timeIn/timeOut are provided
        mileage:
          type: number
          minimum: 0
        perDiem:
          type: number
          minimum: 0
          maximum: 1
        perDiemType:
          $ref: "#/components/schemas/PerDiemType"
        note:
          type: string
        status:
          $ref: "#/components/schemas/CreateEntryStatus"
      required:
        - clientId
        - date
    PerDiemType:
      type: string
      enum: [first_last, full]
      description: Per-diem option — "First/Last day" or "Full day"
    ApproveAllResult:
      type: object
      properties:
        approvedCount:
          type: number
      required:
        - approvedCount
    ApiError:
      type: object
      properties:
        message:
          type: string
        # Optional stable machine-readable code so apps can branch without
        # matching on human wording (e.g. SIGN_IN_DISABLED, LINK_REQUEST_PENDING,
        # NOT_LINKED).
        code:
          type: string
      required:
        - message
