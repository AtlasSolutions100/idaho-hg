      tags: [quickbooks]
      summary: QuickBooks connection status
      description: Reports whether Intuit credentials are configured and whether a live connection exists. When connected, includes the company name fetched from QuickBooks to prove the tokens work.
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboStatus"
  /qbo/invoice:
    post:
      operationId: sendInvoiceToQbo
      tags: [quickbooks]
      summary: Send a client invoice into QuickBooks
      description: Rebuilds the invoice report server-side for the given client and period, matches (or creates) the QuickBooks customer and service items, then creates the invoice in QuickBooks in a single call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QboInvoiceSend"
      responses:
        "200":
          description: The invoice created in QuickBooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboSentInvoice"
        "400":
          description: Invalid parameters or nothing billable in the period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: QuickBooks is not connected, or this client + period was already sent (see alreadySent; retry with confirmDuplicate to send anyway)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboSendConflict"
        "502":
          description: QuickBooks rejected the request; nothing was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /qbo/sent-invoices:
    get:
      operationId: getQboSentInvoice
      tags: [quickbooks]
      summary: Most recent recorded QuickBooks send for a client + period
      description: Returns the newest recorded "Send to QuickBooks" for the given client and billing period, so the invoice screen can show it before Molly reaches for the button.
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
