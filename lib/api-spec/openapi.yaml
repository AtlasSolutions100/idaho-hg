      description: Initial status for a new entry — save as a private draft or submit for approval. Defaults to submitted.
    VisitType:
      type: string
      description: >-
        Visit-type key from the admin-managed visit_types catalog (e.g. "soc",
        "eval"). Open string — no fixed enum — so Molly can add new visit types
        with no code change; the server validates it against the catalog on write.
    ClientRateType:
      type: string
      description: >-
        Rate-line key for a client billing rate. A visit-type key from the
        visit_types catalog, or one of the reserved keys "hourly",
        "hourly-{ROLE}", "mileage", or "per-diem". Open string — validated
        server-side.
    DisciplineItem:
      type: object
      properties:
        key:
          type: string
          description: The value stored on employees.role and used in rate keys ("RN", "PT").
        label:
          type: string
        active:
          type: boolean
        sortOrder:
          type: number
      required: [key, label, active, sortOrder]
    CreateDiscipline:
      type: object
      properties:
        key:
          type: string
          description: Rate-key value. Derived from the label when omitted.
        label:
          type: string
        sortOrder:
          type: number
      required: [label]
    UpdateDiscipline:
      type: object
      properties:
        label:
          type: string
        active:
          type: boolean
        sortOrder:
          type: number
    UpdateEmployeeDiscipline:
      type: object
      properties:
        discipline:
          type: string
          description: A key from the /disciplines catalog.
      required: [discipline]
    UpdateEmployeeDisciplineResult:
      type: object
      properties:
        employee:
          $ref: "#/components/schemas/Employee"
        restampedEntryCount:
          type: number
          description: >-
            How many not-yet-approved entries were re-stamped with the new
            discipline. Approved entries are never touched.
      required: [employee, restampedEntryCount]
    BillingUnit:
      type: string
      enum: [visit, increment]
      description: >-
        How a visit type is counted and priced. "visit" is one flat rate per
        visit (the default). "increment" is priced BY THE HOUR and entered in
        `incrementMinutes` steps — St. Luke's pays Hospital at Home and drive
        time hourly but logs them to the quarter hour, so the rate is the
        hourly rate while the entry records how many blocks. Multiply the two
        only after converting blocks to hours.
    VisitTypeItem:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        abbreviation:
          type: string
        active:
          type: boolean
        sortOrder:
          type: number
        disciplines:
          type: array
          items:
            type: string
          description: >-
            Discipline keys allowed to log this visit type. Empty/omitted means
            every discipline.
        billingUnit:
          $ref: "#/components/schemas/BillingUnit"
        incrementMinutes:
          type: number
          description: >-
            Entry granularity in minutes when billingUnit is "increment" — 15
            means time is logged in quarter hours. Not a pricing unit: the
            rate is hourly.
      required: [key, label, abbreviation, active, sortOrder, billingUnit, incrementMinutes]
    CreateVisitType:
      type: object
      properties:
        key:
          type: string
          description: Stable slug (lowercase). Generated from the label when omitted.
        label:
          type: string
        abbreviation:
          type: string
        sortOrder:
          type: number
        disciplines:
          type: array
          items:
            type: string
        billingUnit:
          $ref: "#/components/schemas/BillingUnit"
        incrementMinutes:
          type: number
          minimum: 1
          maximum: 480
      required: [label, abbreviation]
    UpdateVisitType:
      type: object
      properties:
        label:
          type: string
