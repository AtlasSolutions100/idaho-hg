        - employeeName
        - employeeRole
        - clientId
        - clientName
        - date
        - isWeekend
        - isHoliday
        - status
        - submittedAt
    CreateTimeEntry:
      type: object
      properties:
        employeeId:
          type: string
        clientId:
          type: string
        date:
          type: string
        endDate:
          type: string
          description: >-
            Last day covered, for an entry that spans a range instead of one
            day. Only mileage-only entries may use it (St. Luke's employees
            enter one mileage total for a whole pay period). Must be >= date.
        visitType:
          $ref: "#/components/schemas/VisitType"
        quantity:
          type: number
          minimum: 1
          maximum: 100
          description: >-
            How many of this visit type the entry covers — 2 for two evals on
            the same day. For an "increment" visit type it is the number of
            blocks, so a half hour of a 15-minute type is 2. Defaults to 1.
        timeIn:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Clock-in time "HH:MM" (24-hour). Provide with timeOut instead of hours.
        timeOut:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Clock-out time "HH:MM" (24-hour); an earlier time than timeIn means the shift crossed midnight
        hours:
          type: number
          minimum: 0
          maximum: 24
          description: Legacy direct hours; ignored when timeIn/timeOut are provided
        mileage:
          type: number
          minimum: 0
        perDiem:
          type: number
          minimum: 0
          maximum: 1
          description: Legacy numeric per-diem days; ignored when perDiemType is provided
        perDiemType:
          $ref: "#/components/schemas/PerDiemType"
        isWeekend:
          type: boolean
          description: Ignored — the server derives weekend from the date
        isHoliday:
          type: boolean
          description: Ignored — the server determines holidays from its own calendar
        note:
          type: string
        isOther:
          type: boolean
          description: >
            One-off "Other" work (training, meetings, professional development).
            Requires a description in `note` and time worked; visit type and per
            diem are not allowed. Molly sets the pay amount when reviewing.
        status:
          $ref: "#/components/schemas/CreateEntryStatus"
      required:
        - employeeId
        - clientId
        - date
    BatchVisitLine:
      type: object
      description: One visit line in a batch — a visit type and how many of it.
      properties:
        visitType:
          $ref: "#/components/schemas/VisitType"
        quantity:
          type: number
          minimum: 1
          maximum: 100
          description: >-
            How many of this visit. 2 for two evals on the same day; for an
            "increment" visit type, the number of blocks (a half hour of a
            15-minute type is 2). Defaults to 1.
      required: [visitType]
    BatchCreateTimeEntry:
      type: object
      description: >
        Submit several visits for the same client/date in a single atomic
        request. The server inserts one time entry per line inside one
        transaction; mileage and per diem are recorded on the first entry only.

        Send `visits` to give each line its own quantity. `visitTypes` is the
        older shape — a plain list of keys, each counted once — and is still
        accepted so existing app versions keep working. Send one or the other,
        not both.
      properties:
        employeeId:
          type: string
        clientId:
          type: string
        date:
          type: string
        visits:
          type: array
          items:
            $ref: "#/components/schemas/BatchVisitLine"
          minItems: 1
          maxItems: 20
        visitTypes:
          type: array
          items:
            $ref: "#/components/schemas/VisitType"
          minItems: 1
          maxItems: 20
          description: Legacy shape — one entry per key, quantity 1. Prefer `visits`.
        mileage:
          type: number
          minimum: 0
        perDiemType:
          $ref: "#/components/schemas/PerDiemType"
        note:
          type: string
        status:
          $ref: "#/components/schemas/CreateEntryStatus"
      required:
        - employeeId
        - clientId
        - date
    UpdateTimeEntry:
      type: object
      description: >
        Full replacement of an entry's editable fields. The employee never
        changes — only client, date, work details, and (optionally) status.
      properties:
        clientId:
          type: string
        date:
          type: string
        endDate:
          type: string
          description: Last day covered for a mileage-only entry spanning a range; must be >= date
        visitType:
          $ref: "#/components/schemas/VisitType"
        quantity:
          type: number
          minimum: 1
          maximum: 100
          description: How many of this visit type (or billable blocks). Defaults to 1.
        timeIn:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Clock-in time "HH:MM" (24-hour). Provide with timeOut instead of hours.
        timeOut:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Clock-out time "HH:MM" (24-hour); an earlier time than timeIn means the shift crossed midnight
        hours:
          type: number
          minimum: 0
          maximum: 24
          description: Legacy direct hours; ignored when timeIn/timeOut are provided
        mileage:
          type: number
          minimum: 0
        perDiem:
          type: number
          minimum: 0
          maximum: 1
        perDiemType:
          $ref: "#/components/schemas/PerDiemType"
        note:
          type: string
        status:
          $ref: "#/components/schemas/CreateEntryStatus"
      required:
        - clientId
        - date
    PerDiemType:
      type: string
      enum: [first_last, full]
      description: Per-diem option — "First/Last day" or "Full day"
    ApproveAllResult:
      type: object
      properties:
        approvedCount:
          type: number
        skippedUnpricedOtherCount:
          type: number
          description: Waiting "Other" one-offs left unapproved because they have no pay amount yet
      required:
        - approvedCount
        - skippedUnpricedOtherCount
    ApiError:
      type: object
      properties:
        message:
          type: string
        # Optional stable machine-readable code so apps can branch without
        # matching on human wording (e.g. SIGN_IN_DISABLED, LINK_REQUEST_PENDING,
        # NOT_LINKED).
        code:
          type: string
      required:
        - message
    ClaimableEmployee:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - role
    CreateLinkRequest:
      type: object
      properties:
        employeeId:
          type: string
          minLength: 1
        discipline:
          type: string
          description: >-
            The discipline the person says they are, chosen from /disciplines
            when they claim the profile. Recorded on the request so Molly can
            see it (and any disagreement with the profile) before approving;
            approving applies it to the profile.
      required:
        - employeeId
    LinkRequest:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        employeeName:
          type: string
        employeeRole:
          type: string
        email:
          type: string
        requestedAt:
          type: string
        claimedDiscipline:
          type: string
          description: The discipline the claimant selected, when they picked one
      required:
        - id
        - employeeId
        - employeeName
        - employeeRole
        - email
        - requestedAt
