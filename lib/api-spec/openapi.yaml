openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: time-entries
    description: Time entry operations
  - name: rates
    description: Client and employee rate operations
  - name: onboarding
    description: Per-employee onboarding checklist tracking
  - name: roster
    description: Client and employee roster operations
  - name: reports
    description: Payroll and invoice reports computed from approved time entries
  - name: demo
    description: Load and remove clearly-labeled practice (demo) data
  - name: workflow
    description: Lightweight per-period check-offs for the weekly guide
  - name: feedback
    description: In-app feedback from users to the developers
  - name: settings
    description: Business details and invoice numbering for PDF invoices
  - name: quickbooks
    description: QuickBooks Online connection (OAuth 2.0 with Intuit)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [time-entries]
      summary: List time entries
      description: Returns time entries, optionally filtered by employee or status
      parameters:
        - name: employeeId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EntryStatus"
      responses:
        "200":
          description: >
            Time entries. An employee receives only their own (including their
            drafts); the admin receives everyone's, without drafts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Signed in, but not a working profile (or not the admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createTimeEntry
      tags: [time-entries]
      summary: Submit a time entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimeEntry"
      responses:
        "201":
          description: Created time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Signed in, but not a working profile (or not the admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}:
    patch:
      operationId: updateTimeEntry
      tags: [time-entries]
      summary: Edit a time entry (draft, submitted, or rejected — never approved)
      description: >
        Replaces the entry's editable fields, re-running all creation rules
        (visit-type gating, mileage-on-contract, clock-time hours, valid dates).
        The entry's own employee may edit, and Molly (admin) may fix a
        submitted entry before approving it — admin edits are recorded on the
        entry (adminEditedAt / adminEditSummary) so the employee can see what
        changed. Approved entries are locked. Passing status "submitted" on a
        draft or rejected entry submits it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimeEntry"
      responses:
        "200":
          description: Updated time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Validation error or entry is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}/price:
    post:
      operationId: priceTimeEntry
      tags: [time-entries]
      summary: Set the pay (and optional client billing) amount for an "Other" entry
      description: >
        Admin only. "Other" one-off entries have no standard rate — Molly sets
        a flat pay amount (what the employee receives) and optionally a flat
        billing amount (what the client is invoiced) while reviewing. Approved
        entries are locked; drafts are never visible to the admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceTimeEntry"
      responses:
        "200":
          description: Updated time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Not an Other entry, entry locked, or invalid amounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}/approve:
    post:
      operationId: approveTimeEntry
      tags: [time-entries]
      summary: Approve a time entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}/reject:
    post:
      operationId: rejectTimeEntry
      tags: [time-entries]
      summary: Reject a time entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/batch:
    post:
      operationId: batchCreateTimeEntries
      tags: [time-entries]
      summary: Submit multiple visit-type entries for one day atomically
      description: >
        Inserts one time entry per visit type in a single database transaction.
        Mileage and per diem are assigned to the first entry only.
        If any insert fails the entire batch is rolled back — no partial state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateTimeEntry"
      responses:
        "201":
          description: All entries created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Validation error (nothing was written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Signed in, but not a working profile (or not the admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/approve-all:
    post:
      operationId: approveAllTimeEntries
      tags: [time-entries]
      summary: Approve all submitted time entries
      description: >
        Approves every waiting (submitted) entry EXCEPT "Other" one-offs that
        Molly hasn't priced yet — approving would lock them with no pay
        amount. Skipped entries are counted so the UI can tell her to price
        them first.
      responses:
        "200":
          description: Result of bulk approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveAllResult"
  /client-rates:
    get:
      operationId: listClientRates
      tags: [rates]
      summary: List client billing rates
      responses:
        "200":
          description: List of client rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRate"
    post:
      operationId: createClientRate
      tags: [rates]
      summary: Add a new billing rate type (e.g. hourly) for an existing client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRate"
      responses:
        "201":
          description: Created client rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A rate of this type already exists for the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /client-rates/{id}:
    patch:
      operationId: updateClientRate
      tags: [rates]
      summary: Update a client billing rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRate"
      responses:
        "200":
          description: Updated client rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /client-rates/{id}/history:
    get:
      operationId: listClientRateHistory
      tags: [rates]
      summary: List all historical rates for the client/visit-type of the given rate row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rate history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRate"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /client-pay-rates:
    get:
      operationId: listClientPayRates
      tags: [rates]
      summary: List per-client employee PAY rates (hourly pay by client)
      responses:
        "200":
          description: List of client pay rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientPayRate"
    post:
      operationId: createClientPayRate
      tags: [rates]
      summary: Add a per-client hourly PAY rate for a discipline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientPayRate"
      responses:
        "201":
          description: Created client pay rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPayRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A pay rate of this type already exists for the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /client-pay-rates/{id}:
    patch:
      operationId: updateClientPayRate
      tags: [rates]
      summary: Update a per-client pay rate (inserts a new history row)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRate"
      responses:
        "200":
          description: Updated client pay rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPayRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /disciplines:
    get:
      operationId: listDisciplines
      tags: [roster]
      summary: List employee disciplines (admin-managed catalog)
      description: >-
        Public, like /clients and /visit-types: the catalog is just profession
        labels, and someone claiming a roster profile has to pick their
        discipline before they have a linked session.
      responses:
        "200":
          description: List of disciplines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DisciplineItem"
    post:
      operationId: createDiscipline
      tags: [roster]
      summary: Add a new discipline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiscipline"
      responses:
        "201":
          description: Created discipline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisciplineItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A discipline with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /disciplines/{key}:
    patch:
      operationId: updateDiscipline
      tags: [roster]
      summary: Update a discipline (label, active, sort order)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiscipline"
      responses:
        "200":
          description: Updated discipline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisciplineItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Discipline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /visit-types:
    get:
      operationId: listVisitTypes
      tags: [rates]
      summary: List visit types (admin-managed catalog)
      responses:
        "200":
          description: List of visit types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitTypeItem"
    post:
      operationId: createVisitType
      tags: [rates]
      summary: Add a new visit type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVisitType"
      responses:
        "201":
          description: Created visit type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitTypeItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A visit type with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /visit-types/{key}:
    patch:
      operationId: updateVisitType
      tags: [rates]
      summary: Update a visit type (label, abbreviation, active, sort order)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVisitType"
      responses:
        "200":
          description: Updated visit type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitTypeItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Visit type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /visit-pay-rates:
    get:
      operationId: listVisitPayRates
      tags: [rates]
      summary: List per-discipline visit PAY rates
      responses:
        "200":
          description: List of visit pay rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitPayRate"
    post:
      operationId: createVisitPayRate
      tags: [rates]
      summary: Set a per-discipline pay rate for a visit type (append-only history)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVisitPayRate"
      responses:
        "201":
          description: Created visit pay rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitPayRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /visit-pay-rates/{id}:
    patch:
      operationId: updateVisitPayRate
      tags: [rates]
      summary: Update a visit pay rate (inserts a new history row)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVisitPayRate"
      responses:
        "200":
          description: Updated visit pay rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitPayRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Visit pay rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employee-rates:
    get:
      operationId: listEmployeeRates
      tags: [rates]
      summary: List employee pay rates
      responses:
        "200":
          description: List of employee rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeRate"
  /employee-rates/{id}:
    patch:
      operationId: updateEmployeeRate
      tags: [rates]
      summary: Update an employee pay rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRate"
      responses:
        "200":
          description: Updated employee rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employee-rates/{id}/history:
    get:
      operationId: listEmployeeRateHistory
      tags: [rates]
      summary: List all historical pay rates for the employee of the given rate row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rate history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeRate"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clients:
    get:
      operationId: listClients
      tags: [roster]
      summary: List active clients
      responses:
        "200":
          description: List of active clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createClient
      tags: [roster]
      summary: Add a client with an initial billing rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clients/{id}/visit-entry-count:
    get:
      operationId: getClientVisitEntryCount
      tags: [time-entries]
      summary: Count a client's visit-type time entries in recent months
      description: >
        Returns how many time entries with a visit type exist for the client
        in the current and previous two calendar months. Used to warn before
        turning off visit-type billing for a client that already has entries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Visit-type entry count for recent months
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitEntryCount"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Signed in, but not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clients/{id}/hourly-entry-count:
    get:
      operationId: getClientHourlyEntryCount
      tags: [time-entries]
      summary: Count a client's plain hourly time entries in recent months
      description: >
        Returns how many time entries without a visit type exist for the client
        in the current and previous two calendar months. Used to warn before
        turning on visit-type billing for a client whose employees log plain
        time in/out.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hourly (no visit type) entry count for recent months
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HourlyEntryCount"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Signed in, but not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clients/{id}:
    patch:
      operationId: updateClientBilling
      tags: [roster]
      summary: Update a client's optional billing contact and address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBilling"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeClient
      tags: [roster]
      summary: Remove a client (soft delete; past entries are kept)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees:
    get:
      operationId: listEmployees
      tags: [roster]
      summary: List active employees
      responses:
        "200":
          description: List of active employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [roster]
      summary: Add an employee with initial pay rates
