                $ref: "#/components/schemas/ApiError"
  /reports/reconciliation:
    get:
      operationId: getReconciliationReport
      tags: [reports]
      summary: Per-visit reconciliation report with employee notes for a client
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
            type: string
        - name: end
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reconciliation report for the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReport"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees/{id}/onboarding:
    get:
      operationId: listOnboardingItems
      tags: [onboarding]
      summary: List the onboarding checklist for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The employee's onboarding checklist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingItem"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees/{id}/onboarding/{itemKey}:
    patch:
      operationId: updateOnboardingItem
      tags: [onboarding]
      summary: Mark an onboarding checklist item complete or not complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: itemKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
