          $ref: "#/components/schemas/VisitType"
        quantity:
          type: number
          description: >-
            How many of this visit type the entry covers (or how many billable
            blocks for an "increment" type). 1 unless set.
        timeIn:
          type: string
          description: Clock-in time "HH:MM" (24-hour)
        timeOut:
          type: string
          description: Clock-out time "HH:MM" (24-hour)
        hours:
          type: number
        mileage:
          type: number
