          type: boolean
          description: One-off "Other" work (training, meetings) paid at a custom amount Molly sets
        customPayAmount:
          type: number
          description: Molly's flat pay amount in dollars for an Other entry; unset means it still needs pricing
        customBillAmount:
          type: number
          description: Optional flat amount billed to the client for an Other entry; unset means not billed
        status:
          $ref: "#/components/schemas/EntryStatus"
        isDemo:
          type: boolean
        submittedAt:
          type: string
        approvedAt:
          type: string
        adminEditedAt:
          type: string
          description: When Molly (admin) last adjusted this entry during approval
        adminEditSummary:
          type: string
          description: Human-readable summary of what Molly changed
      required:
