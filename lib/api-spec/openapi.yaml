openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: time-entries
    description: Time entry operations
  - name: rates
    description: Client and employee rate operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [time-entries]
      summary: List time entries
      description: Returns time entries, optionally filtered by employee or status
      parameters:
        - name: employeeId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EntryStatus"
      responses:
        "200":
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
    post:
      operationId: createTimeEntry
      tags: [time-entries]
      summary: Submit a time entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimeEntry"
      responses:
        "201":
          description: Created time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}/approve:
    post:
      operationId: approveTimeEntry
      tags: [time-entries]
      summary: Approve a time entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}/reject:
    post:
      operationId: rejectTimeEntry
      tags: [time-entries]
      summary: Reject a time entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/approve-all:
    post:
      operationId: approveAllTimeEntries
      tags: [time-entries]
      summary: Approve all submitted time entries
      responses:
        "200":
          description: Result of bulk approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveAllResult"
  /client-rates:
    get:
      operationId: listClientRates
      tags: [rates]
      summary: List client billing rates
      responses:
        "200":
          description: List of client rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRate"
  /client-rates/{id}:
    patch:
      operationId: updateClientRate
      tags: [rates]
      summary: Update a client billing rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRate"
      responses:
        "200":
          description: Updated client rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /client-rates/{id}/history:
    get:
      operationId: listClientRateHistory
      tags: [rates]
      summary: List all historical rates for the client/visit-type of the given rate row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rate history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRate"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employee-rates:
    get:
      operationId: listEmployeeRates
      tags: [rates]
      summary: List employee pay rates
      responses:
        "200":
          description: List of employee rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeRate"
  /employee-rates/{id}:
    patch:
      operationId: updateEmployeeRate
      tags: [rates]
      summary: Update an employee pay rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRate"
      responses:
        "200":
          description: Updated employee rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employee-rates/{id}/history:
    get:
      operationId: listEmployeeRateHistory
      tags: [rates]
      summary: List all historical pay rates for the employee of the given rate row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rate history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeRate"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ClientRate:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        visitType:
          $ref: "#/components/schemas/VisitType"
        rate:
          type: number
        effectiveDate:
          type: string
      required:
        - id
        - clientId
        - clientName
        - visitType
        - rate
        - effectiveDate
    UpdateClientRate:
      type: object
      properties:
        rate:
          type: number
          minimum: 0
        effectiveDate:
          type: string
      required:
        - rate
        - effectiveDate
    EmployeeRate:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        employeeName:
          type: string
        employeeRole:
          type: string
        hourlyRate:
          type: number
        visitRate:
          type: number
        mileageRate:
          type: number
        perDiemRate:
          type: number
        weekendMultiplier:
          type: number
        holidayMultiplier:
          type: number
        effectiveDate:
          type: string
      required:
        - id
        - employeeId
        - employeeName
        - employeeRole
        - hourlyRate
        - visitRate
        - mileageRate
        - perDiemRate
        - weekendMultiplier
        - holidayMultiplier
        - effectiveDate
    UpdateEmployeeRate:
      type: object
      properties:
        hourlyRate:
          type: number
          minimum: 0
        visitRate:
          type: number
          minimum: 0
        mileageRate:
          type: number
          minimum: 0
        perDiemRate:
          type: number
          minimum: 0
        weekendMultiplier:
          type: number
          minimum: 1
        holidayMultiplier:
          type: number
          minimum: 1
        effectiveDate:
          type: string
      required:
        - hourlyRate
        - visitRate
        - mileageRate
        - perDiemRate
        - weekendMultiplier
        - holidayMultiplier
        - effectiveDate
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EntryStatus:
      type: string
      enum: [submitted, approved, rejected]
    VisitType:
      type: string
      enum: [skilled-nursing, physical-therapy, occupational-therapy, speech-therapy]
    TimeEntry:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        employeeName:
          type: string
        employeeRole:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        date:
          type: string
        visitType:
          $ref: "#/components/schemas/VisitType"
        hours:
          type: number
        mileage:
          type: number
        perDiem:
          type: number
        isWeekend:
          type: boolean
        isHoliday:
          type: boolean
        note:
          type: string
        status:
          $ref: "#/components/schemas/EntryStatus"
        submittedAt:
          type: string
        approvedAt:
          type: string
      required:
        - id
        - employeeId
        - employeeName
        - employeeRole
        - clientId
        - clientName
        - date
        - isWeekend
        - isHoliday
        - status
        - submittedAt
    CreateTimeEntry:
      type: object
      properties:
        employeeId:
          type: string
        clientId:
          type: string
        date:
          type: string
        visitType:
          $ref: "#/components/schemas/VisitType"
        hours:
          type: number
          minimum: 0
          maximum: 24
        mileage:
          type: number
          minimum: 0
        perDiem:
          type: number
          minimum: 0
          maximum: 1
        isWeekend:
          type: boolean
        isHoliday:
          type: boolean
        note:
          type: string
      required:
        - employeeId
        - clientId
        - date
        - isWeekend
        - isHoliday
    ApproveAllResult:
      type: object
      properties:
        approvedCount:
          type: number
      required:
        - approvedCount
    ApiError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
