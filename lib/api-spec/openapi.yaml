openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: time-entries
    description: Time entry operations
  - name: rates
    description: Client and employee rate operations
  - name: onboarding
    description: Per-employee onboarding checklist tracking
  - name: roster
    description: Client and employee roster operations
  - name: reports
    description: Payroll and invoice reports computed from approved time entries
  - name: demo
    description: Load and remove clearly-labeled practice (demo) data
  - name: workflow
    description: Lightweight per-period check-offs for the weekly guide
  - name: feedback
    description: In-app feedback from users to the developers
  - name: settings
    description: Business details and invoice numbering for PDF invoices
  - name: quickbooks
    description: QuickBooks Online connection (OAuth 2.0 with Intuit)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [time-entries]
      summary: List time entries
      description: Returns time entries, optionally filtered by employee or status
      parameters:
        - name: employeeId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EntryStatus"
      responses:
        "200":
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
    post:
      operationId: createTimeEntry
      tags: [time-entries]
      summary: Submit a time entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimeEntry"
      responses:
        "201":
          description: Created time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}/approve:
    post:
      operationId: approveTimeEntry
      tags: [time-entries]
      summary: Approve a time entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}/reject:
    post:
      operationId: rejectTimeEntry
      tags: [time-entries]
      summary: Reject a time entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/approve-all:
    post:
      operationId: approveAllTimeEntries
      tags: [time-entries]
      summary: Approve all submitted time entries
      responses:
        "200":
          description: Result of bulk approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveAllResult"
  /client-rates:
    get:
      operationId: listClientRates
      tags: [rates]
      summary: List client billing rates
      responses:
        "200":
          description: List of client rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRate"
    post:
      operationId: createClientRate
      tags: [rates]
      summary: Add a new billing rate type (e.g. hourly) for an existing client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRate"
      responses:
        "201":
          description: Created client rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A rate of this type already exists for the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /client-rates/{id}:
    patch:
      operationId: updateClientRate
      tags: [rates]
      summary: Update a client billing rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRate"
      responses:
        "200":
          description: Updated client rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /client-rates/{id}/history:
    get:
      operationId: listClientRateHistory
      tags: [rates]
      summary: List all historical rates for the client/visit-type of the given rate row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rate history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRate"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employee-rates:
    get:
      operationId: listEmployeeRates
      tags: [rates]
      summary: List employee pay rates
      responses:
        "200":
          description: List of employee rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeRate"
  /employee-rates/{id}:
    patch:
      operationId: updateEmployeeRate
      tags: [rates]
      summary: Update an employee pay rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRate"
      responses:
        "200":
          description: Updated employee rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employee-rates/{id}/history:
    get:
      operationId: listEmployeeRateHistory
      tags: [rates]
      summary: List all historical pay rates for the employee of the given rate row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rate history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeRate"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clients:
    get:
      operationId: listClients
      tags: [roster]
      summary: List active clients
      responses:
        "200":
          description: List of active clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [roster]
      summary: Add a client with an initial billing rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clients/{id}:
    patch:
      operationId: updateClientBilling
      tags: [roster]
      summary: Update a client's optional billing contact and address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBilling"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeClient
      tags: [roster]
      summary: Remove a client (soft delete; past entries are kept)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees:
    get:
      operationId: listEmployees
      tags: [roster]
      summary: List active employees
      responses:
        "200":
          description: List of active employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [roster]
      summary: Add an employee with initial pay rates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees/{id}:
    delete:
      operationId: removeEmployee
      tags: [roster]
      summary: Remove an employee (soft delete; past entries are kept)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /demo-data:
    get:
      operationId: getDemoDataStatus
      tags: [demo]
      summary: Report whether demo data is loaded and how much exists
      responses:
        "200":
          description: Demo data status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDataStatus"
    post:
      operationId: loadDemoData
      tags: [demo]
      summary: Load the demo dataset (idempotent; never duplicates)
      responses:
        "200":
          description: Demo data status after loading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDataStatus"
    delete:
      operationId: removeDemoData
      tags: [demo]
      summary: Remove every demo-tagged record and all data keyed to it
      responses:
        "200":
          description: Demo data status after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDataStatus"
  /workflow-status:
    get:
      operationId: getWorkflowStatus
      tags: [workflow]
      summary: Get manual check-offs for a period (defaults false when unset)
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow status for the period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatus"
    put:
      operationId: updateWorkflowStatus
      tags: [workflow]
      summary: Update manual check-offs for a period (partial; omitted flags keep their value)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStatusUpdate"
      responses:
        "200":
          description: Updated workflow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatus"
  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List submitted feedback, newest first
      responses:
        "200":
          description: All feedback submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit feedback to the developers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackCreate"
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
  /reports/payroll:
    get:
      operationId: getPayrollReport
      tags: [reports]
      summary: Payroll report from approved entries in a date range
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
        - name: end
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payroll report grouped per employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollReport"
        "400":
          description: Missing or invalid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reports/invoice:
    get:
      operationId: getInvoiceReport
      tags: [reports]
      summary: Client invoice report from approved entries in a date range
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
            type: string
        - name: end
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice report for the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceReport"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reports/reconciliation:
    get:
      operationId: getReconciliationReport
      tags: [reports]
      summary: Per-visit reconciliation report with employee notes for a client
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
            type: string
        - name: end
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reconciliation report for the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReport"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees/{id}/onboarding:
    get:
      operationId: listOnboardingItems
      tags: [onboarding]
      summary: List the onboarding checklist for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The employee's onboarding checklist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingItem"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees/{id}/onboarding/{itemKey}:
    patch:
      operationId: updateOnboardingItem
      tags: [onboarding]
      summary: Mark an onboarding checklist item complete or not complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: itemKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOnboardingItem"
      responses:
        "200":
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee or item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /business-settings:
    get:
      operationId: getBusinessSettings
      tags: [settings]
      summary: Get the business details used on PDF invoices
      responses:
        "200":
          description: Current business settings (defaults when never saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
    put:
      operationId: updateBusinessSettings
      tags: [settings]
      summary: Update the business details used on PDF invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessSettings"
      responses:
        "200":
          description: Saved business settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /business-settings/next-invoice-number:
    post:
      operationId: allocateInvoiceNumber
      tags: [settings]
      summary: Atomically allocate the next invoice number
      description: Returns the next invoice number and increments the stored counter
      responses:
        "200":
          description: The allocated invoice number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocatedInvoiceNumber"
  /qbo/status:
    get:
      operationId: getQboStatus
      tags: [quickbooks]
      summary: QuickBooks connection status
      description: Reports whether Intuit credentials are configured and whether a live connection exists. When connected, includes the company name fetched from QuickBooks to prove the tokens work.
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboStatus"
  /qbo/disconnect:
    post:
      operationId: disconnectQbo
      tags: [quickbooks]
      summary: Disconnect from QuickBooks
      description: Revokes the tokens with Intuit and deletes them from our database
      responses:
        "200":
          description: Disconnected (also returned when nothing was connected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboDisconnectResult"
components:
  schemas:
    BusinessSettings:
      type: object
      properties:
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        paymentTerms:
          type: string
        nextInvoiceNumber:
          type: number
      required:
        - address
        - phone
        - email
        - paymentTerms
        - nextInvoiceNumber
    UpdateBusinessSettings:
      type: object
      properties:
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        paymentTerms:
          type: string
        nextInvoiceNumber:
          type: number
          minimum: 1
    QboStatus:
      type: object
      properties:
        configured:
          type: boolean
          description: Whether Intuit app credentials (Client ID/Secret) are set up
        connected:
          type: boolean
        companyName:
          type: string
          nullable: true
          description: Company name from QuickBooks when connected and reachable
        connectedAt:
          type: string
          nullable: true
        problem:
          type: string
          nullable: true
          description: Plain-language note when the connection needs attention (e.g. needs reconnecting)
      required:
        - configured
        - connected
    QboDisconnectResult:
      type: object
      properties:
        disconnected:
          type: boolean
      required:
        - disconnected
    AllocatedInvoiceNumber:
      type: object
      properties:
        invoiceNumber:
          type: number
      required:
        - invoiceNumber
    OnboardingItem:
      type: object
      properties:
        itemKey:
          type: string
        label:
          type: string
        note:
          type: string
        completed:
          type: boolean
        completedAt:
          type: string
      required:
        - itemKey
        - label
        - completed
    UpdateOnboardingItem:
      type: object
      properties:
        completed:
          type: boolean
      required:
        - completed
    PayrollReportLine:
      type: object
      properties:
        entryId:
          type: string
        date:
          type: string
        clientName:
          type: string
        visitType:
          $ref: "#/components/schemas/VisitType"
        hours:
          type: number
        isWeekend:
          type: boolean
        isHoliday:
          type: boolean
        multiplier:
          type: number
        basePay:
          type: number
        mileage:
          type: number
        mileagePay:
          type: number
        perDiem:
          type: number
        perDiemPay:
          type: number
        total:
          type: number
        missingRate:
          type: boolean
      required:
        - entryId
        - date
        - clientName
        - isWeekend
        - isHoliday
        - multiplier
        - basePay
        - mileagePay
        - perDiemPay
        - total
        - missingRate
    PayrollReportEmployee:
      type: object
      properties:
        employeeId:
          type: string
        employeeName:
          type: string
        employeeRole:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayrollReportLine"
        visitCount:
          type: number
        totalHours:
          type: number
        basePay:
          type: number
        mileagePay:
          type: number
        perDiemPay:
          type: number
        total:
          type: number
      required:
        - employeeId
        - employeeName
        - employeeRole
        - lines
        - visitCount
        - totalHours
        - basePay
        - mileagePay
        - perDiemPay
        - total
    PayrollReport:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        employees:
          type: array
          items:
            $ref: "#/components/schemas/PayrollReportEmployee"
        grandTotal:
          type: number
        entryCount:
          type: number
        missingRateCount:
          type: number
      required:
        - start
        - end
        - employees
        - grandTotal
        - entryCount
        - missingRateCount
    InvoiceLineKind:
      type: string
      enum: [visit, hourly, mileage, per-diem]
    InvoiceReportLine:
      type: object
      properties:
        lineId:
          type: string
        date:
          type: string
        productService:
          type: string
        description:
          type: string
        qty:
          type: number
        rate:
          type: number
        amount:
          type: number
        kind:
          $ref: "#/components/schemas/InvoiceLineKind"
        missingRate:
          type: boolean
        note:
          type: string
      required:
        - lineId
        - date
        - productService
        - description
        - qty
        - amount
        - kind
        - missingRate
    InvoiceReport:
      type: object
      properties:
        clientId:
          type: string
        clientName:
          type: string
        start:
          type: string
        end:
          type: string
        lines:
          type: array
          items:
