openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: time-entries
    description: Time entry operations
  - name: rates
    description: Client and employee rate operations
  - name: onboarding
    description: Per-employee onboarding checklist tracking
  - name: roster
    description: Client and employee roster operations
  - name: reports
    description: Payroll and invoice reports computed from approved time entries
  - name: demo
    description: Load and remove clearly-labeled practice (demo) data
  - name: workflow
    description: Lightweight per-period check-offs for the weekly guide
  - name: feedback
    description: In-app feedback from users to the developers
  - name: settings
    description: Business details and invoice numbering for PDF invoices
  - name: quickbooks
    description: QuickBooks Online connection (OAuth 2.0 with Intuit)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [time-entries]
      summary: List time entries
      description: Returns time entries, optionally filtered by employee or status
      parameters:
        - name: employeeId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EntryStatus"
      responses:
        "200":
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
    post:
      operationId: createTimeEntry
      tags: [time-entries]
      summary: Submit a time entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimeEntry"
      responses:
        "201":
          description: Created time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}:
    patch:
      operationId: updateTimeEntry
      tags: [time-entries]
      summary: Edit a time entry (draft, submitted, or rejected — never approved)
      description: >
        Replaces the entry's editable fields, re-running all creation rules
        (visit-type gating, mileage-on-contract, clock-time hours, valid dates).
        The entry's own employee may edit, and Molly (admin) may fix a
        submitted entry before approving it — admin edits are recorded on the
        entry (adminEditedAt / adminEditSummary) so the employee can see what
        changed. Approved entries are locked. Passing status "submitted" on a
        draft or rejected entry submits it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimeEntry"
      responses:
        "200":
          description: Updated time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Validation error or entry is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}/approve:
    post:
      operationId: approveTimeEntry
      tags: [time-entries]
      summary: Approve a time entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/{id}/reject:
    post:
      operationId: rejectTimeEntry
      tags: [time-entries]
      summary: Reject a time entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/batch:
    post:
      operationId: batchCreateTimeEntries
      tags: [time-entries]
      summary: Submit multiple visit-type entries for one day atomically
      description: >
        Inserts one time entry per visit type in a single database transaction.
        Mileage and per diem are assigned to the first entry only.
        If any insert fails the entire batch is rolled back — no partial state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateTimeEntry"
      responses:
        "201":
          description: All entries created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Validation error (nothing was written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /time-entries/approve-all:
    post:
      operationId: approveAllTimeEntries
      tags: [time-entries]
      summary: Approve all submitted time entries
      responses:
        "200":
          description: Result of bulk approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveAllResult"
  /client-rates:
    get:
      operationId: listClientRates
      tags: [rates]
      summary: List client billing rates
      responses:
        "200":
          description: List of client rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRate"
    post:
      operationId: createClientRate
      tags: [rates]
      summary: Add a new billing rate type (e.g. hourly) for an existing client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRate"
      responses:
        "201":
          description: Created client rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A rate of this type already exists for the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /client-rates/{id}:
    patch:
      operationId: updateClientRate
      tags: [rates]
      summary: Update a client billing rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRate"
      responses:
        "200":
          description: Updated client rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /client-rates/{id}/history:
    get:
      operationId: listClientRateHistory
      tags: [rates]
      summary: List all historical rates for the client/visit-type of the given rate row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rate history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRate"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employee-rates:
    get:
      operationId: listEmployeeRates
      tags: [rates]
      summary: List employee pay rates
      responses:
        "200":
          description: List of employee rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeRate"
  /employee-rates/{id}:
    patch:
      operationId: updateEmployeeRate
      tags: [rates]
      summary: Update an employee pay rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRate"
      responses:
        "200":
          description: Updated employee rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeRate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employee-rates/{id}/history:
    get:
      operationId: listEmployeeRateHistory
      tags: [rates]
      summary: List all historical pay rates for the employee of the given rate row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rate history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeRate"
        "404":
          description: Rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clients:
    get:
      operationId: listClients
      tags: [roster]
      summary: List active clients
      responses:
        "200":
          description: List of active clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [roster]
      summary: Add a client with an initial billing rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clients/{id}/visit-entry-count:
    get:
      operationId: getClientVisitEntryCount
      tags: [time-entries]
      summary: Count a client's visit-type time entries in recent months
      description: >
        Returns how many time entries with a visit type exist for the client
        in the current and previous two calendar months. Used to warn before
        turning off visit-type billing for a client that already has entries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Visit-type entry count for recent months
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitEntryCount"
  /clients/{id}/hourly-entry-count:
    get:
      operationId: getClientHourlyEntryCount
      tags: [time-entries]
      summary: Count a client's plain hourly time entries in recent months
      description: >
        Returns how many time entries without a visit type exist for the client
        in the current and previous two calendar months. Used to warn before
        turning on visit-type billing for a client whose employees log plain
        time in/out.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hourly (no visit type) entry count for recent months
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HourlyEntryCount"
  /clients/{id}:
    patch:
      operationId: updateClientBilling
      tags: [roster]
      summary: Update a client's optional billing contact and address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBilling"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeClient
      tags: [roster]
      summary: Remove a client (soft delete; past entries are kept)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees:
    get:
      operationId: listEmployees
      tags: [roster]
      summary: List active employees
      responses:
        "200":
          description: List of active employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [roster]
      summary: Add an employee with initial pay rates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me:
    get:
      operationId: getMyEmployee
      tags: [roster]
      summary: Get the roster employee for the signed-in user
      responses:
        "200":
          description: The signed-in employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Signed-in email is not on the roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/contact:
    patch:
      operationId: updateMyContact
      tags: [roster]
      summary: Update the signed-in employee's own contact details (phone, contact email, address)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeContact"
      responses:
        "200":
          description: Updated employee (own record)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Signed-in email is not on the roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /link-requests/claimable:
    get:
      operationId: listClaimableEmployees
      tags: [roster]
      summary: List roster profiles a signed-in but unlinked person can claim
      responses:
        "200":
          description: Active employees without a linked sign-in email
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaimableEmployee"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /link-requests:
    get:
      operationId: listLinkRequests
      tags: [roster]
      summary: List pending profile link requests awaiting Molly's approval
      responses:
        "200":
          description: Pending link requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkRequest"
    post:
      operationId: createLinkRequest
      tags: [roster]
      summary: Ask to link the signed-in email to a roster profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Created link request (waiting for Molly)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Profile already linked, or this email already has a claim or profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /link-requests/mine:
    delete:
      operationId: cancelMyLinkRequest
      tags: [roster]
      summary: Cancel the signed-in email's own pending link request
      responses:
        "200":
          description: The cancelled (removed) link request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRequest"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No pending request for this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /link-requests/{id}/approve:
    post:
      operationId: approveLinkRequest
      tags: [roster]
      summary: Approve a link request, attaching the email to the profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The employee with the newly linked email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The profile or email was linked in the meantime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /link-requests/{id}/deny:
    post:
      operationId: denyLinkRequest
      tags: [roster]
      summary: Deny a link request; the person stays blocked
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The denied (removed) link request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRequest"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees/{id}/contact:
    patch:
      operationId: updateEmployeeContact
      tags: [roster]
      summary: Update an employee's contact details (phone, contact email, address)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeContact"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees/{id}:
    patch:
      operationId: updateEmployeeEmail
      tags: [roster]
      summary: Set or clear an employee's sign-in email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeEmail"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already used by another employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeEmployee
      tags: [roster]
      summary: Remove an employee (soft delete; past entries are kept)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /employees/{id}/sign-in-access:
    patch:
      operationId: updateEmployeeSignInAccess
      tags: [roster]
      summary: Turn an employee's mobile-app sign-in on or off
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeSignInAccess"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /demo-data:
    get:
      operationId: getDemoDataStatus
      tags: [demo]
      summary: Report whether demo data is loaded and how much exists
      responses:
        "200":
          description: Demo data status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDataStatus"
    post:
      operationId: loadDemoData
      tags: [demo]
      summary: Load the demo dataset (idempotent; never duplicates)
      responses:
        "200":
          description: Demo data status after loading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDataStatus"
    delete:
      operationId: removeDemoData
      tags: [demo]
      summary: Remove every demo-tagged record and all data keyed to it
      responses:
        "200":
          description: Demo data status after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDataStatus"
  /workflow-status:
    get:
      operationId: getWorkflowStatus
      tags: [workflow]
      summary: Get manual check-offs for a period (defaults false when unset)
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow status for the period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatus"
    put:
      operationId: updateWorkflowStatus
      tags: [workflow]
      summary: Update manual check-offs for a period (partial; omitted flags keep their value)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStatusUpdate"
      responses:
        "200":
          description: Updated workflow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatus"
  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List submitted feedback, newest first
      responses:
        "200":
