          required: true
          schema:
            type: string
      responses:
        "200":
          description: The latest recorded send, or sent=false when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboSentInvoiceLookup"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /qbo/disconnect:
    post:
      operationId: disconnectQbo
      tags: [quickbooks]
      summary: Disconnect from QuickBooks
      description: Revokes the tokens with Intuit and deletes them from our database
      responses:
        "200":
          description: Disconnected (also returned when nothing was connected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboDisconnectResult"
components:
  schemas:
    BusinessSettings:
      type: object
      properties:
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        paymentTerms:
          type: string
        nextInvoiceNumber:
          type: number
      required:
        - address
        - phone
        - email
        - paymentTerms
        - nextInvoiceNumber
    UpdateBusinessSettings:
      type: object
      properties:
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        paymentTerms:
          type: string
        nextInvoiceNumber:
          type: number
          minimum: 1
    QboStatus:
      type: object
      properties:
        configured:
          type: boolean
          description: Whether Intuit app credentials (Client ID/Secret) are set up
        connected:
          type: boolean
        companyName:
          type: string
          nullable: true
          description: Company name from QuickBooks when connected and reachable
        connectedAt:
          type: string
          nullable: true
        problem:
          type: string
          nullable: true
          description: Plain-language note when the connection needs attention (e.g. needs reconnecting)
        callbackUrl:
          type: string
          nullable: true
          description: The exact redirect URI Intuit must have registered for the connect flow to return
        environment:
          type: string
          enum: [sandbox, production]
          description: Which QuickBooks environment invoices go to — Intuit's practice sandbox or real QuickBooks
        sandboxInProduction:
          type: boolean
          description: True when the published (deployed) app is still pointed at the sandbox — a misconfiguration worth a loud warning
      required:
        - configured
        - connected
        - callbackUrl
        - environment
        - sandboxInProduction
    QboInvoiceSend:
      type: object
      properties:
        clientId:
          type: string
        start:
          type: string
        end:
          type: string
        confirmDuplicate:
          type: boolean
          description: Set true to send again after the already-sent warning
      required:
        - clientId
        - start
        - end
    QboSendConflict:
      type: object
      description: 409 body for the send endpoint. When alreadySent is true, this client + period has a recorded send and the request must be retried with confirmDuplicate to proceed.
      properties:
        message:
          type: string
        alreadySent:
          type: boolean
        previousSentAt:
          type: string
          description: When the earlier send happened (ISO timestamp)
        previousDocNumber:
          type: ["string", "null"]
          description: QuickBooks invoice number from the earlier send
        previousQboInvoiceId:
          type: string
      required:
        - message
    QboSentInvoice:
      type: object
      properties:
        qboInvoiceId:
          type: string
        docNumber:
          type: ["string", "null"]
          description: QuickBooks invoice number, when QuickBooks assigned one
        customerName:
          type: string
        lineCount:
          type: number
        total:
          type: number
      required:
        - qboInvoiceId
        - docNumber
        - customerName
        - lineCount
        - total
    QboSentInvoiceLookup:
      type: object
      description: Newest recorded QuickBooks send for a client + period. When sent is false the other fields are null.
      properties:
        sent:
          type: boolean
        sentAt:
          type: ["string", "null"]
          description: When the send happened (ISO timestamp)
        docNumber:
          type: ["string", "null"]
          description: QuickBooks invoice number, when QuickBooks assigned one
        qboInvoiceId:
          type: ["string", "null"]
      required:
        - sent
        - sentAt
        - docNumber
        - qboInvoiceId
    QboDisconnectResult:
      type: object
      properties:
        disconnected:
          type: boolean
      required:
        - disconnected
    AllocatedInvoiceNumber:
      type: object
      properties:
        invoiceNumber:
          type: number
      required:
        - invoiceNumber
    OnboardingItem:
      type: object
      properties:
        itemKey:
          type: string
        label:
          type: string
        note:
          type: string
        completed:
          type: boolean
        completedAt:
          type: string
      required:
