        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOnboardingItem"
      responses:
        "200":
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee or item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /business-settings:
    get:
      operationId: getBusinessSettings
      tags: [settings]
      summary: Get the business details used on PDF invoices
      responses:
        "200":
          description: Current business settings (defaults when never saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
    put:
      operationId: updateBusinessSettings
      tags: [settings]
      summary: Update the business details used on PDF invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessSettings"
      responses:
        "200":
          description: Saved business settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /business-settings/next-invoice-number:
    post:
      operationId: allocateInvoiceNumber
      tags: [settings]
      summary: Atomically allocate the next invoice number
      description: Returns the next invoice number and increments the stored counter
      responses:
        "200":
          description: The allocated invoice number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocatedInvoiceNumber"
  /qbo/status:
    get:
      operationId: getQboStatus
      tags: [quickbooks]
      summary: QuickBooks connection status
      description: Reports whether Intuit credentials are configured and whether a live connection exists. When connected, includes the company name fetched from QuickBooks to prove the tokens work.
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboStatus"
  /qbo/invoice:
    post:
      operationId: sendInvoiceToQbo
      tags: [quickbooks]
      summary: Send a client invoice into QuickBooks
      description: Rebuilds the invoice report server-side for the given client and period, matches (or creates) the QuickBooks customer and service items, then creates the invoice in QuickBooks in a single call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QboInvoiceSend"
      responses:
        "200":
          description: The invoice created in QuickBooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboSentInvoice"
        "400":
          description: Invalid parameters or nothing billable in the period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: QuickBooks is not connected, or this client + period was already sent (see alreadySent; retry with confirmDuplicate to send anyway)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboSendConflict"
        "502":
          description: QuickBooks rejected the request; nothing was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /qbo/sent-invoices:
    get:
      operationId: getQboSentInvoice
      tags: [quickbooks]
      summary: Most recent recorded QuickBooks send for a client + period
      description: Returns the newest recorded "Send to QuickBooks" for the given client and billing period, so the invoice screen can show it before Molly reaches for the button.
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
            type: string
        - name: end
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The latest recorded send, or sent=false when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboSentInvoiceLookup"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /qbo/disconnect:
    post:
      operationId: disconnectQbo
      tags: [quickbooks]
      summary: Disconnect from QuickBooks
      description: Revokes the tokens with Intuit and deletes them from our database
      responses:
        "200":
          description: Disconnected (also returned when nothing was connected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QboDisconnectResult"
components:
  schemas:
    BusinessSettings:
      type: object
      properties:
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        paymentTerms:
          type: string
        nextInvoiceNumber:
          type: number
      required:
        - address
        - phone
        - email
        - paymentTerms
        - nextInvoiceNumber
    UpdateBusinessSettings:
      type: object
      properties:
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        paymentTerms:
          type: string
        nextInvoiceNumber:
          type: number
          minimum: 1
    QboStatus:
      type: object
      properties:
        configured:
          type: boolean
          description: Whether Intuit app credentials (Client ID/Secret) are set up
        connected:
          type: boolean
        companyName:
          type: string
          nullable: true
          description: Company name from QuickBooks when connected and reachable
        connectedAt:
          type: string
          nullable: true
        problem:
          type: string
          nullable: true
          description: Plain-language note when the connection needs attention (e.g. needs reconnecting)
        callbackUrl:
          type: string
          nullable: true
          description: The exact redirect URI Intuit must have registered for the connect flow to return
        environment:
          type: string
          enum: [sandbox, production]
          description: Which QuickBooks environment invoices go to — Intuit's practice sandbox or real QuickBooks
        sandboxInProduction:
          type: boolean
          description: True when the published (deployed) app is still pointed at the sandbox — a misconfiguration worth a loud warning
      required:
        - configured
        - connected
        - callbackUrl
        - environment
        - sandboxInProduction
    QboInvoiceSend:
      type: object
      properties:
        clientId:
          type: string
        start:
          type: string
        end:
          type: string
        confirmDuplicate:
          type: boolean
          description: Set true to send again after the already-sent warning
      required:
        - clientId
        - start
        - end
    QboSendConflict:
      type: object
      description: 409 body for the send endpoint. When alreadySent is true, this client + period has a recorded send and the request must be retried with confirmDuplicate to proceed.
      properties:
        message:
          type: string
        alreadySent:
          type: boolean
        previousSentAt:
          type: string
          description: When the earlier send happened (ISO timestamp)
        previousDocNumber:
          type: ["string", "null"]
          description: QuickBooks invoice number from the earlier send
        previousQboInvoiceId:
          type: string
      required:
        - message
    QboSentInvoice:
      type: object
      properties:
        qboInvoiceId:
          type: string
        docNumber:
          type: ["string", "null"]
          description: QuickBooks invoice number, when QuickBooks assigned one
        customerName:
          type: string
        lineCount:
          type: number
        total:
          type: number
      required:
        - qboInvoiceId
        - docNumber
        - customerName
        - lineCount
        - total
    QboSentInvoiceLookup:
      type: object
      description: Newest recorded QuickBooks send for a client + period. When sent is false the other fields are null.
      properties:
        sent:
          type: boolean
        sentAt:
          type: ["string", "null"]
          description: When the send happened (ISO timestamp)
        docNumber:
          type: ["string", "null"]
          description: QuickBooks invoice number, when QuickBooks assigned one
        qboInvoiceId:
          type: ["string", "null"]
      required:
        - sent
        - sentAt
        - docNumber
        - qboInvoiceId
    QboDisconnectResult:
      type: object
      properties:
        disconnected:
          type: boolean
      required:
        - disconnected
    AllocatedInvoiceNumber:
      type: object
      properties:
        invoiceNumber:
          type: number
      required:
        - invoiceNumber
    OnboardingItem:
      type: object
      properties:
        itemKey:
          type: string
        label:
          type: string
        note:
          type: string
        completed:
          type: boolean
        completedAt:
          type: string
      required:
        - itemKey
        - label
        - completed
    UpdateOnboardingItem:
      type: object
      properties:
        completed:
          type: boolean
      required:
        - completed
    PayrollReportLine:
      type: object
      properties:
        entryId:
          type: string
        date:
          type: string
        clientName:
          type: string
        visitType:
          $ref: "#/components/schemas/VisitType"
        hours:
          type: number
        isWeekend:
          type: boolean
        isHoliday:
          type: boolean
        multiplier:
          type: number
        basePay:
          type: number
        mileage:
          type: number
        mileagePay:
          type: number
        perDiem:
          type: number
        perDiemPay:
          type: number
        total:
          type: number
        missingRate:
          type: boolean
      required:
        - entryId
        - date
        - clientName
        - isWeekend
        - isHoliday
        - multiplier
        - basePay
        - mileagePay
        - perDiemPay
        - total
        - missingRate
    PayrollReportEmployee:
      type: object
      properties:
        employeeId:
          type: string
        employeeName:
          type: string
        employeeRole:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayrollReportLine"
        visitCount:
          type: number
        totalHours:
          type: number
        basePay:
          type: number
        mileagePay:
          type: number
        perDiemPay:
          type: number
        total:
          type: number
      required:
        - employeeId
        - employeeName
        - employeeRole
        - lines
        - visitCount
        - totalHours
        - basePay
        - mileagePay
        - perDiemPay
        - total
    PayrollReport:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        employees:
          type: array
          items:
            $ref: "#/components/schemas/PayrollReportEmployee"
        grandTotal:
          type: number
        entryCount:
          type: number
        missingRateCount:
          type: number
      required:
        - start
        - end
        - employees
        - grandTotal
        - entryCount
        - missingRateCount
    InvoiceLineKind:
      type: string
      enum: [visit, hourly, mileage, per-diem]
    InvoiceReportLine:
      type: object
      properties:
        lineId:
          type: string
        date:
          type: string
        productService:
          type: string
        description:
          type: string
        qty:
          type: number
        rate:
          type: number
        amount:
          type: number
        kind:
          $ref: "#/components/schemas/InvoiceLineKind"
        missingRate:
          type: boolean
        note:
          type: string
      required:
        - lineId
        - date
        - productService
        - description
        - qty
        - amount
        - kind
        - missingRate
    InvoiceReport:
      type: object
      properties:
        clientId:
          type: string
        clientName:
          type: string
        start:
          type: string
        end:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceReportLine"
        total:
          type: number
        entryCount:
          type: number
        missingRateCount:
          type: number
        unbilledCount:
          type: number
      required:
        - clientId
        - clientName
        - start
        - end
        - lines
        - total
        - entryCount
        - missingRateCount
        - unbilledCount
    ReconciliationReportLine:
      type: object
      properties:
        entryId:
          type: string
        date:
          type: string
        visitType:
          $ref: "#/components/schemas/VisitType"
        hours:
          type: number
        mileage:
          type: number
        perDiem:
          type: number
        isWeekend:
          type: boolean
        isHoliday:
          type: boolean
        note:
          type: string
      required:
        - entryId
        - date
        - isWeekend
        - isHoliday
        - note
    VisitTypeCount:
      type: object
      properties:
        visitType:
          $ref: "#/components/schemas/VisitType"
        count:
          type: number
      required:
        - visitType
        - count
    ReconciliationEmployeeGroup:
      type: object
      properties:
        employeeId:
          type: string
        employeeName:
          type: string
        employeeRole:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationReportLine"
        visitCounts:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypeCount"
        totalVisits:
          type: number
        totalHours:
          type: number
        totalMileage:
          type: number
        totalPerDiem:
          type: number
      required:
        - employeeId
        - employeeName
        - employeeRole
        - lines
        - visitCounts
        - totalVisits
        - totalHours
        - totalMileage
        - totalPerDiem
    ReconciliationTotals:
      type: object
      properties:
        visitCounts:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypeCount"
        totalVisits:
          type: number
        totalHours:
          type: number
        totalMileage:
          type: number
        totalPerDiem:
          type: number
      required:
        - visitCounts
        - totalVisits
        - totalHours
        - totalMileage
        - totalPerDiem
    ReconciliationReport:
      type: object
      properties:
        clientId:
          type: string
        clientName:
          type: string
        start:
          type: string
        end:
          type: string
        employees:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationEmployeeGroup"
        totals:
          $ref: "#/components/schemas/ReconciliationTotals"
        entryCount:
          type: number
      required:
        - clientId
        - clientName
        - start
        - end
        - employees
        - totals
        - entryCount
    WorkflowStatus:
      type: object
      properties:
        period:
          type: string
        exportDone:
          type: boolean
        invoicesDone:
          type: boolean
      required:
        - period
        - exportDone
        - invoicesDone
    WorkflowStatusUpdate:
      type: object
      properties:
        period:
          type: string
        exportDone:
          type: boolean
        invoicesDone:
          type: boolean
      required:
        - period
    Feedback:
      type: object
      properties:
        id:
          type: number
        type:
          type: string
          enum: [problem, idea, other]
        message:
          type: string
        name:
          type: string
        page:
          type: string
        createdAt:
          type: string
      required:
        - id
        - type
        - message
        - createdAt
    FeedbackCreate:
      type: object
      properties:
        type:
          type: string
          enum: [problem, idea, other]
        message:
          type: string
        name:
          type: string
        page:
          type: string
      required:
        - type
        - message
    DemoDataStatus:
      type: object
      properties:
        loaded:
          type: boolean
        clientCount:
          type: number
        employeeCount:
          type: number
        entryCount:
          type: number
      required:
        - loaded
        - clientCount
        - employeeCount
        - entryCount
    VisitEntryCount:
      type: object
      required: [count]
      properties:
        count:
          type: number
          description: Number of visit-type time entries in the current and previous two calendar months
    HourlyEntryCount:
      type: object
      required: [count]
      properties:
        count:
          type: number
          description: Number of time entries without a visit type in the current and previous two calendar months
    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
        isDemo:
          type: boolean
        billingContact:
          type: string
          description: Optional contact person shown on PDF invoices
        billingAddress:
          type: string
          description: Optional multi-line billing address shown on PDF invoices
        mileageOnContract:
          type: boolean
          description: Whether this client's contract includes mileage reimbursement
        billsByVisitType:
          type: boolean
          description: Whether this client bills by visit type (only St. Luke's by default); other clients use the simple hourly form
      required:
        - id
        - name
        - active
        - isDemo
        - mileageOnContract
        - billsByVisitType
    ClientInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        visitType:
          $ref: "#/components/schemas/VisitType"
        rate:
          type: number
          minimum: 0
        billingContact:
          type: string
        billingAddress:
          type: string
      required:
        - name
        - visitType
        - rate
    UpdateClientBilling:
      type: object
      properties:
        billingContact:
          type: string
        billingAddress:
          type: string
        mileageOnContract:
          type: boolean
          description: Only applied when present; billing fields keep their clear-on-blank behavior
        billsByVisitType:
          type: boolean
          description: Only applied when present; controls whether the visit-type entry form is shown
    Employee:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        active:
          type: boolean
        isDemo:
          type: boolean
        email:
          type: string
        signInEnabled:
          type: boolean
        phone:
          type: string
        contactEmail:
          type: string
        address:
          type: string
      required:
        - id
        - name
        - role
        - active
        - isDemo
        - signInEnabled
    EmployeeInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        hourlyRate:
          type: number
          minimum: 0
        visitRate:
          type: number
          minimum: 0
        mileageRate:
          type: number
          minimum: 0
        perDiemRate:
          type: number
          minimum: 0
        weekendMultiplier:
          type: number
          minimum: 1
        holidayMultiplier:
          type: number
          minimum: 1
        email:
          type: string
        phone:
          type: string
        contactEmail:
          type: string
        address:
          type: string
      required:
        - name
        - role
        - hourlyRate
        - visitRate
        - mileageRate
        - perDiemRate
        - weekendMultiplier
        - holidayMultiplier
    UpdateEmployeeEmail:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    UpdateEmployeeContact:
      type: object
      properties:
        phone:
          type: string
        contactEmail:
          type: string
        address:
          type: string
    UpdateEmployeeSignInAccess:
      type: object
      properties:
        signInEnabled:
          type: boolean
      required:
        - signInEnabled
    ClientRate:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        visitType:
          type: string
          description: >
            The rate key stored in the database. For plain visit types this is
            the ClientRateType value (e.g. "soc"). For discipline-specific rates
            it is "{ClientRateType}-{Discipline}" (e.g. "soc-RN"). For
            discipline-specific hourly rates it is "hourly-{Discipline}"
            (e.g. "hourly-RN").
        rate:
          type: number
        effectiveDate:
          type: string
      required:
        - id
        - clientId
        - clientName
        - visitType
        - rate
        - effectiveDate
    UpdateClientRate:
      type: object
      properties:
        rate:
          type: number
          minimum: 0
        effectiveDate:
          type: string
      required:
        - rate
        - effectiveDate
    Discipline:
      type: string
      description: Employee discipline/role abbreviation
      enum:
        - RN
        - PT
        - OT
        - SLP
        - PTA
        - LPN
        - ST
        - LCSW
    CreateClientRate:
      type: object
      properties:
        clientId:
          type: string
          minLength: 1
        rateType:
          $ref: "#/components/schemas/ClientRateType"
        discipline:
          $ref: "#/components/schemas/Discipline"
          description: >
            If set, this rate applies only to employees of that discipline.
            The stored key becomes "{rateType}-{discipline}" (e.g. "soc-RN"),
            so the invoice route can try the role-specific key first and fall
            back to the plain rateType for clients with a single rate per visit type.
        rate:
          type: number
          minimum: 0
        effectiveDate:
          type: string
      required:
        - clientId
        - rateType
        - rate
        - effectiveDate
