kind = "web"
previewPath = "/"
title = "Hodge Staffing Time App"
version = "1.0.0"
id = "artifacts/staffing-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22152

[services.development]
run = "pnpm --filter @workspace/staffing-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/staffing-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/staffing-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22152"
BASE_PATH = "/"
