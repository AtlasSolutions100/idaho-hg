kind = "mobile"
previewPath = "/employee-mobile/"
title = "IHS Employee App"
description = "A mobile app for Idaho Healthcare Staffing employees to log their hours on the go: pick their name from the roster, log visits or hourly shifts with mileage and per-diem, and see their submitted entries and approval status. Uses the same backend as the web app."
version = "1.0.0"
id = "artifacts/employee-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/employee-mobile/" ]
localPort = 20208

[services.development]
run = "pnpm --filter @workspace/employee-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/employee-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/employee-mobile", "run", "serve" ]

[services.env]
PORT = "20208"
BASE_PATH = "/employee-mobile/"
